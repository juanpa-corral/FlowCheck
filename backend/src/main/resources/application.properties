# ============================================================
# FlowCheck Backend — Configuración
# ============================================================

spring.application.name=flowcheck-backend
server.port=8080

# ── Base de datos (Supabase PostgreSQL) ──────────────────────
# Formato: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JWT (Supabase JWT Secret) ─────────────────────────────────
# Obtener en: Supabase Dashboard → Settings → API → JWT Secret
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────
logging.level.com.flowcheck=INFO
logging.level.org.springframework.security=WARN
