<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#1D9E75" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FlowCheck — Tu salud financiera</title>
    <!-- Inter font (pesos 400, 500, 600, 700, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset ─────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      /* ── Tipografía global ─────────────────────────────────── */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: var(--c-shell);    /* exterior del "teléfono" en escritorio */
        color: var(--c-text-primary);
        transition: background-color 0.25s ease, color 0.2s ease;
      }

      /* ══════════════════════════════════════════════════════════
         DESIGN TOKENS — Modo Claro (default)
         ══════════════════════════════════════════════════════════ */
      :root {
        /* Brand */
        --c-primary:       #1D9E75;
        --c-primary-light: #E8F8F3;
        --c-primary-dark:  #157A5A;

        /* Alphas de brand (para bordes, overlays) */
        --c-primary-a10:   rgba(29, 158, 117, 0.10);
        --c-primary-a20:   rgba(29, 158, 117, 0.20);
        --c-primary-a30:   rgba(29, 158, 117, 0.30);
        --c-primary-a40:   rgba(29, 158, 117, 0.40);

        /* Alerta */
        --c-yellow:        #EF9F27;
        --c-yellow-light:  #FEF3DC;
        --c-yellow-dark:   #D4891F;
        --c-yellow-a40:    rgba(239, 159, 39, 0.40);

        /* Riesgo */
        --c-red:           #E24B4A;
        --c-red-light:     #FDECEA;
        --c-red-dark:      #C43635;
        --c-red-a20:       rgba(226, 75, 74, 0.20);
        --c-red-a30:       rgba(226, 75, 74, 0.30);

        /* Layout */
        --c-bg:            #F8FFFE;
        --c-card:          #FFFFFF;
        --c-card-elevated: #FFFFFF;
        --c-border:        #DCF0E8;
        --c-shell:         #E2EBE9;  /* fondo exterior en escritorio */

        /* Texto */
        --c-text-primary:   #1A2E2A;
        --c-text-secondary: #4B6B62;
        --c-text-muted:     #8BA89F;

        /* Glassmorphism bottom nav */
        --c-glass-bg:      rgba(255, 255, 255, 0.88);
        --c-glass-border:  rgba(220, 240, 232, 0.8);
        --c-glass-shadow:  0 -1px 0 rgba(0,0,0,0.04), 0 -4px 24px rgba(0,0,0,0.06);
      }

      /* ══════════════════════════════════════════════════════════
         DESIGN TOKENS — Modo Oscuro
         ══════════════════════════════════════════════════════════ */
      html.dark {
        /* Brand — más brillante sobre fondo oscuro */
        --c-primary:       #34D399;
        --c-primary-light: rgba(52, 211, 153, 0.12);
        --c-primary-dark:  #10B981;

        --c-primary-a10:   rgba(52, 211, 153, 0.10);
        --c-primary-a20:   rgba(52, 211, 153, 0.20);
        --c-primary-a30:   rgba(52, 211, 153, 0.30);
        --c-primary-a40:   rgba(52, 211, 153, 0.40);

        /* Alerta */
        --c-yellow:        #FBBF24;
        --c-yellow-light:  rgba(251, 191, 36, 0.12);
        --c-yellow-dark:   #F59E0B;
        --c-yellow-a40:    rgba(251, 191, 36, 0.30);

        /* Riesgo */
        --c-red:           #F87171;
        --c-red-light:     rgba(248, 113, 113, 0.12);
        --c-red-dark:      #EF4444;
        --c-red-a20:       rgba(248, 113, 113, 0.20);
        --c-red-a30:       rgba(248, 113, 113, 0.30);

        /* Layout */
        --c-bg:            #0F172A;
        --c-card:          #1E293B;
        --c-card-elevated: #243349;
        --c-border:        #334155;
        --c-shell:         #020617;  /* fondo exterior */

        /* Texto */
        --c-text-primary:   #F1F5F9;
        --c-text-secondary: #94A3B8;
        --c-text-muted:     #64748B;

        /* Glassmorphism bottom nav — modo oscuro */
        --c-glass-bg:      rgba(15, 23, 42, 0.92);
        --c-glass-border:  rgba(51, 65, 85, 0.8);
        --c-glass-shadow:  0 -1px 0 rgba(255,255,255,0.04), 0 -4px 24px rgba(0,0,0,0.4);
      }

      /* ── Transición suave entre temas ──────────────────────── */
      *, *::before, *::after {
        transition: background-color 0.25s ease, border-color 0.2s ease, color 0.2s ease;
      }
      /* Excluir animaciones de transición/transform para no romper UX */
      [style*="transition"], button, a, input, [role="button"] {
        transition: background-color 0.25s ease, border-color 0.2s ease, color 0.2s ease,
                    transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      /* ── Ocultar scrollbar en filtros horizontales ─────────── */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* ── Range input styling ─────────────────────────────────  */
      input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; outline: none; background: var(--c-border); }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--c-primary); cursor: pointer; box-shadow: 0 2px 6px var(--c-primary-a40); }

      /* ── Date input ─────────────────────────────────────────── */
      input[type="date"]::-webkit-calendar-picker-indicator { filter: opacity(0.5); cursor: pointer; }
      html.dark input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.5); }

      /* ── Phone frame en escritorio ──────────────────────────── */
      @media (min-width: 540px) {
        #phone-shell {
          border-radius: 40px;
          overflow: hidden;
          box-shadow: 0 32px 80px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08);
          margin-top: 24px;
          margin-bottom: 24px;
          min-height: calc(100vh - 48px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
